services:
  mysql:
    image: mysql:8.0
    container_name: ramlewheels_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ramlewheels}
      MYSQL_USER: ${MYSQL_USER:-ramlewheels}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dimples}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ramlewheels_network
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      PMA_ABSOLUTE_URI: http://localhost:8080/
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - ramlewheels_network
volumes:
  mysql_data:
networks:
  ramlewheels_network:
    driver: bridge