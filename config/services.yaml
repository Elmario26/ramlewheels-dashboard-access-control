# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    car_images_directory: '%kernel.project_dir%/public/uploads/cars'
    documents_directory: '%kernel.project_dir%/public/uploads/documents'
    brevo_api_key: '%env(default::BREVO_API_KEY)%'
    env(GOOGLE_CLIENT_ID): ''
    env(GOOGLE_CLIENT_SECRET): ''
    env(GOOGLE_ANDROID_CLIENT_ID): ''
    # Fallbacks for mobile Google Sign-In when Railway env vars are unset (public OAuth client IDs)
    google.oauth.web_client_id: '220287836624-tm0ep198jig2bvdt2mtv4fom64uksqa5.apps.googleusercontent.com'
    google.oauth.android_client_id: '220287836624-0lf7m4ip4nomci3dl7hjrkertklcasqt.apps.googleusercontent.com'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Controller\Api\ContactController:
        arguments:
            $brevoApiKey: '%brevo_api_key%'

    App\Service\RailwayDatabaseSyncService:
        arguments:
            $railwayDatabaseUrl: '%env(default::RAILWAY_DATABASE_URL)%'

    App\Controller\Dev\RailwaySyncController:
        arguments:
            $syncSecret: '%env(default::SYNC_SECRET)%'

    App\Command\BuildRailwaySeedCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Command\ImportRailwaySeedCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\GoogleIdTokenVerifier:
        arguments:
            $googleClientId: '%env(default:google.oauth.web_client_id:GOOGLE_CLIENT_ID)%'
            $googleAndroidClientId: '%env(default:google.oauth.android_client_id:GOOGLE_ANDROID_CLIENT_ID)%'

    App\Service\WebsocketEmitter:
        arguments:
            $gatewayUrl: '%env(default::WS_GATEWAY_URL)%'
            $internalToken: '%env(default::WS_INTERNAL_TOKEN)%'
